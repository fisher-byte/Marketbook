# MarketBook Development Docker Compose Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

version: '3.8'

services:
  app:
    build:
      target: dependencies  # Use lighter build for development
    environment:
      - NODE_ENV=development
      - DEBUG=marketbook:*
      - LOG_LEVEL=debug
    volumes:
      # Mount source code for hot-reload
      - ./src:/app/src
      - ./public:/app/public
      - ./views:/app/views
      # Mount node_modules as named volume to avoid conflicts
      - node_modules:/app/node_modules
    command: npm run dev
    ports:
      - "9229:9229"  # Node.js debugger port

  # MongoDB is optional in dev (using memory store)
  mongodb:
    profiles: ["full"]  # Only start with --profile full

  # Redis is optional in dev
  redis:
    profiles: ["full"]  # Only start with --profile full

volumes:
  node_modules:

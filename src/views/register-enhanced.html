<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - MarketBook</title>
    <meta name="description" content="注册MarketBook账户，开启您的智能交易学习之旅">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            padding: var(--spacing-xl);
        }
        
        .auth-card {
            background: var(--bg-primary);
            padding: var(--spacing-2xl);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }
        
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .auth-header h1 {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }
        
        .auth-header p {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--font-size-sm);
        }
        
        .form-input {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            transition: all var(--transition-fast);
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .form-input.error {
            border-color: var(--error-color);
        }
        
        .error-message {
            color: var(--error-color);
            font-size: var(--font-size-xs);
            margin-top: var(--spacing-xs);
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .password-strength {
            margin-top: var(--spacing-sm);
        }
        
        .strength-bar {
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        
        .strength-bar::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            transition: all var(--transition-normal);
        }
        
        .strength-bar.weak::after {
            width: 33%;
            background: var(--error-color);
        }
        
        .strength-bar.medium::after {
            width: 66%;
            background: var(--warning-color);
        }
        
        .strength-bar.strong::after {
            width: 100%;
            background: var(--success-color);
        }
        
        .strength-text {
            display: block;
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            margin-top: var(--spacing-xs);
        }
        
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-sm);
        }
        
        .checkbox-group input[type="checkbox"] {
            margin-top: 0.25rem;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        
        .checkbox-group label {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            line-height: 1.5;
        }
        
        .checkbox-group a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .checkbox-group a:hover {
            text-decoration: underline;
        }
        
        .auth-button {
            width: 100%;
            padding: var(--spacing-md);
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-bottom: var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }
        
        .auth-button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }
        
        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .auth-footer {
            text-align: center;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        
        .auth-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .auth-container {
                padding: var(--spacing-md);
            }
            
            .auth-card {
                padding: var(--spacing-xl);
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>加入MarketBook</h1>
                <p>创建您的交易学习账户</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" id="username" class="form-input" 
                           placeholder="3-20个字符，支持字母、数字、下划线" 
                           autocomplete="username" required>
                    <div class="error-message" id="usernameError"></div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">邮箱地址</label>
                    <input type="email" id="email" class="form-input" 
                           placeholder="请输入您的邮箱" 
                           autocomplete="email" required>
                    <div class="error-message" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" id="password" class="form-input" 
                           placeholder="至少6个字符，包含字母和数字" 
                           autocomplete="new-password" required>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                        <span class="strength-text" id="strengthText">密码强度: 弱</span>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">确认密码</label>
                    <input type="password" id="confirmPassword" class="form-input" 
                           placeholder="请再次输入密码" 
                           autocomplete="new-password" required>
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        我已阅读并同意 <a href="/terms" target="_blank">服务条款</a> 和 
                        <a href="/privacy" target="_blank">隐私政策</a>
                    </label>
                </div>
                
                <button type="submit" class="auth-button" id="submitBtn">
                    <span id="buttonText">注册账户</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>已有账户？ <a href="/login">立即登录</a></p>
            </div>
        </div>
    </div>
    
    <script src="/js/utils.js"></script>
    <script>
        const { Auth, Validator, UI, Router } = window.MarketBook;

        // 密码强度检查
        function checkPasswordStrength(password) {
            let strength = 0;
            
            if (password.length >= 6) strength += 1;
            if (password.length >= 10) strength += 1;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 1;
            if (/\d/.test(password)) strength += 1;
            if (/[^a-zA-Z0-9]/.test(password)) strength += 1;
            
            return strength;
        }

        // 更新密码强度显示
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            if (!password) {
                strengthBar.className = 'strength-bar';
                strengthText.textContent = '密码强度: 弱';
                return;
            }
            
            const strength = checkPasswordStrength(password);
            
            if (strength <= 2) {
                strengthBar.className = 'strength-bar weak';
                strengthText.textContent = '密码强度: 弱';
            } else if (strength <= 3) {
                strengthBar.className = 'strength-bar medium';
                strengthText.textContent = '密码强度: 中等';
            } else {
                strengthBar.className = 'strength-bar strong';
                strengthText.textContent = '密码强度: 强';
            }
        });

        // 表单提交处理
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsAccepted = document.getElementById('terms').checked;
            const button = document.getElementById('submitBtn');
            
            // 清除之前的错误
            UI.clearAllErrors('registerForm');
            
            // 前端验证
            let isValid = true;
            
            // 用户名验证
            if (!Validator.username(username)) {
                UI.showFieldError('username', '用户名格式不正确（3-20个字符，字母数字下划线）');
                isValid = false;
            }
            
            // 邮箱验证
            if (!Validator.email(email)) {
                UI.showFieldError('email', '请输入有效的邮箱地址');
                isValid = false;
            }
            
            // 密码验证
            const passwordCheck = Validator.password(password);
            if (!passwordCheck.valid) {
                UI.showFieldError('password', passwordCheck.message);
                isValid = false;
            }
            
            // 确认密码
            if (password !== confirmPassword) {
                UI.showFieldError('confirmPassword', '两次输入的密码不一致');
                isValid = false;
            }
            
            // 服务条款
            if (!termsAccepted) {
                UI.toast('请阅读并同意服务条款', 'warning');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // 显示加载状态
            UI.showLoading(button, '注册中...');
            
            try {
                // 调用注册API
                const response = await Auth.register({
                    username,
                    email,
                    password
                });
                
                // 注册成功
                UI.toast('注册成功！请登录', 'success');
                
                // 延迟跳转到登录页
                setTimeout(() => {
                    Router.navigate('/login');
                }, 1000);
                
            } catch (error) {
                console.error('注册失败:', error);
                
                // 显示错误消息
                if (error.status === 409) {
                    UI.toast('该邮箱或用户名已被注册', 'error');
                } else if (error.data && error.data.errors) {
                    // 显示字段级别的错误
                    Object.keys(error.data.errors).forEach(field => {
                        UI.showFieldError(field, error.data.errors[field]);
                    });
                } else {
                    UI.toast(error.message || '注册失败，请重试', 'error');
                }
                
                // 恢复按钮状态
                UI.hideLoading(button);
            }
        });
        
        // 实时字段验证
        document.getElementById('username').addEventListener('blur', function() {
            UI.clearFieldError('username');
            if (this.value && !Validator.username(this.value)) {
                UI.showFieldError('username', '用户名格式不正确');
            }
        });
        
        document.getElementById('email').addEventListener('blur', function() {
            UI.clearFieldError('email');
            if (this.value && !Validator.email(this.value)) {
                UI.showFieldError('email', '邮箱格式不正确');
            }
        });
        
        document.getElementById('password').addEventListener('blur', function() {
            UI.clearFieldError('password');
            if (this.value) {
                const check = Validator.password(this.value);
                if (!check.valid) {
                    UI.showFieldError('password', check.message);
                }
            }
        });
        
        document.getElementById('confirmPassword').addEventListener('blur', function() {
            UI.clearFieldError('confirmPassword');
            const password = document.getElementById('password').value;
            if (this.value && this.value !== password) {
                UI.showFieldError('confirmPassword', '两次输入的密码不一致');
            }
        });

        // 自动聚焦到用户名输入框
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - MarketBook</title>
    <meta name="description" content="登录MarketBook AI交易平台，开始您的专业交易学习之旅">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            padding: var(--spacing-xl);
        }
        
        .auth-card {
            background: var(--bg-primary);
            padding: var(--spacing-2xl);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }
        
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .auth-header h1 {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }
        
        .auth-header p {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--font-size-sm);
        }
        
        .form-input {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            transition: all var(--transition-fast);
            background: var(--bg-primary);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .form-input.error {
            border-color: var(--error-color);
        }
        
        .error-message {
            color: var(--error-color);
            font-size: var(--font-size-xs);
            margin-top: var(--spacing-xs);
            display: none;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            font-size: var(--font-size-sm);
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        
        .forgot-password:hover {
            color: var(--primary-dark);
        }
        
        .auth-button {
            width: 100%;
            padding: var(--spacing-md);
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-bottom: var(--spacing-lg);
        }
        
        .auth-button:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }
        
        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .auth-divider {
            text-align: center;
            margin: var(--spacing-xl) 0;
            position: relative;
            color: var(--text-muted);
            font-size: var(--font-size-sm);
        }
        
        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-color);
        }
        
        .auth-divider span {
            background: var(--bg-primary);
            padding: 0 var(--spacing-md);
            position: relative;
        }
        
        .social-login {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }
        
        .social-button {
            flex: 1;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            font-size: var(--font-size-sm);
        }
        
        .social-button:hover {
            border-color: var(--primary-color);
            background: var(--bg-secondary);
        }
        
        .auth-footer {
            text-align: center;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        
        .auth-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .auth-container {
                padding: var(--spacing-md);
            }
            
            .auth-card {
                padding: var(--spacing-xl);
            }
            
            .social-login {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>欢迎回来</h1>
                <p>登录您的MarketBook账户</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">邮箱地址</label>
                    <input type="email" id="email" class="form-input" placeholder="请输入您的邮箱" required>
                    <div class="error-message" id="emailError">请输入有效的邮箱地址</div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
                    <div class="error-message" id="passwordError">密码不能为空</div>
                </div>
                
                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>记住我</span>
                    </label>
                    <a href="/forgot-password" class="forgot-password">忘记密码？</a>
                </div>
                
                <button type="submit" class="auth-button" id="loginButton">
                    <span id="buttonText">登录</span>
                    <span id="loadingSpinner" style="display: none;">登录中...</span>
                </button>
            </form>
            
            <div class="auth-divider">
                <span>或使用第三方登录</span>
            </div>
            
            <div class="social-login">
                <button type="button" class="social-button" onclick="socialLogin('wechat')">
                    <span>微信登录</span>
                </button>
                <button type="button" class="social-button" onclick="socialLogin('github')">
                    <span>GitHub</span>
                </button>
            </div>
            
            <div class="auth-footer">
                <p>还没有账户？ <a href="/register">立即注册</a></p>
            </div>
        </div>
    </div>
    
    <script src="/js/utils.js"></script>
    <script>
        const { Auth, Validator, UI, Router } = window.MarketBook;

        // 表单提交处理
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const button = document.getElementById('loginButton');
            
            // 清除之前的错误
            UI.clearAllErrors('loginForm');
            
            // 前端验证
            let isValid = true;
            
            if (!Validator.email(email)) {
                UI.showFieldError('email', '请输入有效的邮箱地址');
                isValid = false;
            }
            
            if (!Validator.required(password)) {
                UI.showFieldError('password', '请输入密码');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // 显示加载状态
            UI.showLoading(button, '登录中...');
            
            try {
                // 调用登录API
                const response = await Auth.login({
                    email,
                    password
                }, rememberMe);
                
                // 登录成功
                UI.toast('登录成功！', 'success');
                
                // 延迟跳转以显示成功消息
                setTimeout(() => {
                    Router.returnAfterLogin();
                }, 500);
                
            } catch (error) {
                console.error('登录失败:', error);
                
                // 显示错误消息
                if (error.status === 401) {
                    UI.toast('邮箱或密码错误', 'error');
                } else if (error.status === 429) {
                    UI.toast('登录尝试次数过多，请稍后再试', 'error');
                } else {
                    UI.toast(error.message || '登录失败，请重试', 'error');
                }
                
                // 恢复按钮状态
                UI.hideLoading(button);
            }
        });
        
        // 社交登录（占位功能）
        function socialLogin(provider) {
            UI.toast(`${provider} 登录功能即将上线`, 'info');
        }
        
        // 实时表单验证
        document.getElementById('email').addEventListener('blur', function() {
            UI.clearFieldError('email');
            if (this.value && !Validator.email(this.value)) {
                UI.showFieldError('email', '邮箱格式不正确');
            }
        });
        
        document.getElementById('password').addEventListener('blur', function() {
            UI.clearFieldError('password');
            if (this.value && this.value.length < 6) {
                UI.showFieldError('password', '密码至少需要6个字符');
            }
        });

        // 自动聚焦到邮箱输入框
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('email').focus();
        });
    </script>
</body>
</html>

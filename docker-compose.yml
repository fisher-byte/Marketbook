# MarketBook Docker Compose 配置
# 用于本地开发和生产部署

version: '3.8'

services:
  # ============================
  # MarketBook 应用服务
  # ============================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: marketbook-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # 应用基础配置
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:3000}
      
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      
      # 数据库配置（可选，当前使用内存存储）
      # MONGODB_URI: ${MONGODB_URI}
      # REDIS_URL: ${REDIS_URL}
      
      # 邮件服务（可选）
      # SMTP_HOST: ${SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT}
      # SMTP_USER: ${SMTP_USER}
      # SMTP_PASS: ${SMTP_PASS}
      # EMAIL_FROM: ${EMAIL_FROM}
      
      # 行情API（可选）
      # ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      # YAHOO_FINANCE_API_KEY: ${YAHOO_FINANCE_API_KEY}
      
      # 日志与监控
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # SENTRY_DSN: ${SENTRY_DSN}
      
      # 安全配置
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      
    volumes:
      # 持久化日志
      - ./logs:/app/logs
      # 持久化数据（可选，用于内存数据备份）
      - ./data:/app/data
    
    networks:
      - marketbook-network
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health/live', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    labels:
      - "com.marketbook.service=app"
      - "com.marketbook.version=1.0.0"

